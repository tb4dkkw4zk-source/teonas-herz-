<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff5eb">
<link rel="manifest" href="manifest.webmanifest">
<title>TEONAS HERZ – Prototyp</title>
<style>
:root{--ink:#493b35;--cream:#fffaf5;--peach:#ffe8d8;--pink:#ffe7ed;--blue:#e6f3ff;--green:#e8f5e9;--lilac:#f0eaff}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}
header{padding:18px 16px 12px;text-align:center;background:linear-gradient(180deg,#fff0e4,#fffaf5)}
.mascots{font-size:42px;letter-spacing:5px}.brand{font-weight:800;font-size:25px;letter-spacing:.5px}.tag{font-size:13px;color:#806b60;margin-top:4px}
main{max-width:760px;margin:auto;padding:16px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
select,button{font:inherit}select{border:1px solid #e6d8ce;border-radius:12px;padding:10px;background:white;color:var(--ink)}
h1{font-size:23px;margin:12px 0 6px}p{line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{border:0;border-radius:20px;padding:17px 10px;min-height:145px;background:white;box-shadow:0 2px 10px #503b3010;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.card:active{transform:scale(.98)}.pic{font-size:48px;line-height:1.2}.word{font-size:19px;font-weight:750}
.hint{font-size:14px;color:#79685f;margin:6px 0 16px}
.back{border:0;border-radius:12px;padding:10px 14px;background:#f3e9e2;color:var(--ink);font-weight:650}
.phrase{margin-top:16px;padding:14px;border-radius:16px;background:#fff0e7;font-weight:650;min-height:52px}
footer{text-align:center;color:#8a786e;font-size:12px;padding:22px 12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.card{min-height:160px}}
</style>
</head>
<body>
<header><div class="mascots" aria-label="Fuchs, Hase und Herz">🦊 🐰 ❤️</div><div class="brand">TEONAS HERZ</div><div class="tag" id="tagline">Eine Herzenshilfe für jedes Kind.</div></header>
<main>
<div class="toolbar">
  <strong id="choose">Wähle deine Sprache</strong>
  <select id="language" aria-label="Sprache">
    <option value="de">Deutsch</option><option value="hy">Հայերեն</option><option value="ru">Русский</option><option value="en">English</option>
  </select>
</div>
<div id="app"></div>
<div class="phrase" id="phrase" aria-live="polite">❤️</div>
</main>
<footer>Ein erster, kostenloser Prototyp · Noch nicht die fertige App</footer>
<script>
const words={
de:{welcome:"Hallo! Was möchtest du machen?",hint:"Tippe auf ein Bild – das Wort wird automatisch gesprochen.",communication:"Kommunikation",drink:"Trinken",eat:"Essen",play:"Spielen",toilet:"Toilette",mama:"Mama",papa:"Papa",feelings:"Gefühle",help:"Hilfe",other:"Etwas anderes",water:"Wasser",juice:"Saft",milk:"Milch",strawberry:"Erdbeere",wantDrink:"Ich möchte {x} trinken.",wantEat:"Ich möchte {x} essen.",back:"Zurück",say:"Ich möchte etwas anderes.",paint:"Malen & Kreativität",games:"Lernspiele",everyday:"Alltag lernen",videos:"Lernvideos"},
hy:{welcome:"Բարև։ Ի՞նչ ես ուզում անել։",hint:"Հպվիր նկարին․ բառը կհնչի։",communication:"Հաղորդակցություն",drink:"Խմել",eat:"Ուտել",play:"Խաղալ",toilet:"Զուգարան",mama:"Մայրիկ",papa:"Հայրիկ",feelings:"Զգացմունքներ",help:"Օգնություն",other:"Ուրիշ բան",water:"Ջուր",juice:"Հյութ",milk:"Կաթ",strawberry:"Ելակ",wantDrink:"Ես ուզում եմ խմել՝ {x}։",wantEat:"Ես ուզում եմ ուտել՝ {x}։",back:"Հետ",say:"Ես ուրիշ բան եմ ուզում։",paint:"Նկարչություն և ստեղծագործություն",games:"Ուսուցողական խաղեր",everyday:"Առօրյա կյանք",videos:"Ուսուցողական տեսանյութեր"},
ru:{welcome:"Привет! Что ты хочешь сделать?",hint:"Нажми на картинку — слово прозвучит автоматически.",communication:"Общение",drink:"Пить",eat:"Есть",play:"Играть",toilet:"Туалет",mama:"Мама",papa:"Папа",feelings:"Чувства",help:"Помощь",other:"Что-то другое",water:"Вода",juice:"Сок",milk:"Молоко",strawberry:"Клубника",wantDrink:"Я хочу пить: {x}.",wantEat:"Я хочу съесть: {x}.",back:"Назад",say:"Я хочу что-то другое.",paint:"Рисование и творчество",games:"Обучающие игры",everyday:"Повседневные дела",videos:"Обучающие видео"},
en:{welcome:"Hello! What would you like to do?",hint:"Tap a picture — the word will be spoken automatically.",communication:"Communication",drink:"Drink",eat:"Eat",play:"Play",toilet:"Toilet",mama:"Mum",papa:"Dad",feelings:"Feelings",help:"Help",other:"Something else",water:"Water",juice:"Juice",milk:"Milk",strawberry:"Strawberry",wantDrink:"I would like {x} to drink.",wantEat:"I would like to eat {x}.",back:"Back",say:"I want something else.",paint:"Art & creativity",games:"Learning games",everyday:"Everyday learning",videos:"Learning videos"}
};
const speechLang={de:"de-DE",hy:"hy-AM",ru:"ru-RU",en:"en-US"};
let lang="de",page="home";
const app=document.getElementById("app"),phrase=document.getElementById("phrase"),sel=document.getElementById("language");
function t(k){return words[lang][k]||k}
function speak(text){phrase.textContent=text;if(!("speechSynthesis" in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=speechLang[lang];u.rate=.88;u.pitch=1.05;window.speechSynthesis.speak(u)}
function card(emoji,key,fn,bg){const b=document.createElement("button");b.className="card";b.style.background=bg||"white";b.innerHTML=`<span class="pic" aria-hidden="true">${emoji}</span><span class="word">${t(key)}</span>`;b.addEventListener("click",fn);return b}
function render(){
 app.innerHTML="";
 const h=document.createElement("h1");h.textContent=page==="home"?t("welcome"):t(page);app.append(h);
 const p=document.createElement("p");p.className="hint";p.textContent=t("hint");app.append(p);
 if(page!=="home"){const back=document.createElement("button");back.className="back";back.textContent="← "+t("back");back.onclick=()=>{page="home";render()};app.append(back)}
 const g=document.createElement("div");g.className="grid";
 const add=(emoji,key,fn,bg)=>g.append(card(emoji,key,fn,bg));
 if(page==="home"){
  add("💬","communication",()=>{page="communication";render()}, "#ffe8d8");
  add("🧩","games",()=>speak(t("games")),"#e6f3ff");
  add("🎨","paint",()=>speak(t("paint")),"#f0eaff");
  add("🪥","everyday",()=>speak(t("everyday")),"#e8f5e9");
  add("💗","feelings",()=>speak(t("feelings")),"#ffe7ed");
  add("🎬","videos",()=>speak(t("videos")),"#fff2cf");
 } else if(page==="communication"){
  add("🥤","drink",()=>{page="drink";render()},"#e6f3ff");add("🍽️","eat",()=>{page="eat";render()},"#ffe8d8");
  add("🧸","play",()=>speak(t("play")),"#f0eaff");add("🚽","toilet",()=>speak(t("toilet")),"#e8f5e9");
  add("👩","mama",()=>speak(t("mama")),"#ffe7ed");add("👨","papa",()=>speak(t("papa")),"#fff2cf");
  add("🙂","feelings",()=>speak(t("feelings")),"#ffe7ed");add("🆘","help",()=>speak(t("help")),"#ffe8d8");
  add("💭","other",()=>speak(t("say")),"#e6f3ff");
 } else if(page==="drink"){
  [["💧","water"],["🧃","juice"],["🥛","milk"]].forEach(([e,k])=>add(e,k,()=>speak(t("wantDrink").replace("{x}",t(k)))));
 } else if(page==="eat"){
  [["🍓","strawberry"]].forEach(([e,k])=>add(e,k,()=>speak(t("wantEat").replace("{x}",t(k)))));
  add("💭","other",()=>speak(t("say")),"#e6f3ff");
 } else {add("❤️","communication",()=>{page="communication";render()})}
 app.append(g);
}
sel.addEventListener("change",()=>{lang=sel.value;document.documentElement.lang=lang;phrase.textContent="❤️";render()});
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script>
</body></html>
