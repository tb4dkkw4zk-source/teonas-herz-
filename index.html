<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f1">
<title>TEONAS HERZ</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--ink:#4b3932;--muted:#806d63;--paper:#fffaf5;--line:#eadbd1}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{text-align:center;padding:22px 18px 12px;background:linear-gradient(#fff0e4,#fffaf5)}
.logo{display:block;width:min(68vw,250px);height:auto;margin:0 auto 12px;border-radius:28px}
h1{font-size:30px;margin:8px 0 4px;letter-spacing:.3px}
.tagline{margin:0;color:var(--muted);font-size:17px}
main{max-width:760px;margin:auto;padding:18px}
.language{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 24px;font-weight:700}
select{font:inherit;color:var(--ink);background:white;border:1px solid var(--line);border-radius:15px;padding:12px 14px;max-width:58%}
h2{font-size:25px;margin:10px 0 8px}
.hint{color:var(--muted);line-height:1.5;margin:0 0 20px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile{border:0;border-radius:24px;min-height:150px;padding:18px 10px;color:var(--ink);font-size:19px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-shadow:0 5px 18px #6c45300c}
.tile .emoji{font-size:48px;line-height:1.2}
.communication{background:#ffe8d9}.games{background:#e6f2ff}.art{background:#f0eaff}.daily{background:#e8f5e9}.feelings{background:#ffe8ef}.videos{background:#fff2cc}
.panel{margin-top:18px}
.back{border:0;background:#f3e7df;color:var(--ink);border-radius:14px;padding:12px 17px;font-size:16px;font-weight:700;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{border:2px solid #f1dfd3;background:white;border-radius:22px;min-height:132px;padding:14px 8px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:700 18px inherit}
.card .emoji{font-size:42px}
.card:active,.tile:active{transform:scale(.98)}
.sentence{margin-top:18px;padding:16px;background:#fff0e7;border-radius:18px;line-height:1.5}
.sentence button{margin-top:10px;border:0;background:#8b5e4c;color:white;border-radius:14px;padding:12px 16px;font-size:16px}
footer{text-align:center;color:#a18e84;font-size:13px;padding:24px 10px}
@media(min-width:600px){.tile{min-height:180px;font-size:22px}.card{min-height:160px}.card .emoji{font-size:52px}}
</style>
</head>
<body>
<header>
<img class="logo" src="logo.png" alt="Fuchs und Hase halten ein Herz">
<h1>TEONAS HERZ</h1><p class="tagline" id="tagline">Eine Herzenshilfe für jedes Kind.</p>
</header>
<main>
<div class="language"><span id="languageLabel">Wähle deine Sprache</span>
<select id="language" aria-label="Sprache">
<option value="de">Deutsch</option><option value="hy">Հայերեն</option><option value="ru">Русский</option><option value="en">English</option>
</select></div>
<section id="home">
<h2 id="welcome">Hallo! Was möchtest du machen?</h2>
<p class="hint" id="homeHint">Tippe auf ein Bild – das Wort wird automatisch gesprochen.</p>
<div class="tiles">
<button class="tile communication" data-section="communication"><span class="emoji">💬</span><span data-t="communication">Kommunikation</span></button>
<button class="tile games" data-section="games"><span class="emoji">🧩</span><span data-t="games">Lernspiele</span></button>
<button class="tile art" data-section="art"><span class="emoji">🎨</span><span data-t="art">Malen &amp; Kreativität</span></button>
<button class="tile daily" data-section="daily"><span class="emoji">🪥</span><span data-t="daily">Alltag lernen</span></button>
<button class="tile feelings" data-section="feelings"><span class="emoji">💗</span><span data-t="feelings">Gefühle</span></button>
<button class="tile videos" data-section="videos"><span class="emoji">🎬</span><span data-t="videos">Lernvideos</span></button>
</div>
</section>
<section id="detail" hidden class="panel">
<button class="back" id="back">← <span id="backText">Zurück</span></button>
<h2 id="detailTitle"></h2><p class="hint" id="detailHint"></p>
<div class="cards" id="cards"></div>
<div class="sentence" id="sentence" hidden><div id="sentenceText"></div><button id="speakSentence">▶ <span id="speakLabel">Satz sprechen</span></button></div>
</section>
</main>
<footer>Mit Liebe gemacht · Kostenlos und werbefrei</footer>
<script>
const translations={
de:{language:"Wähle deine Sprache",welcome:"Hallo! Was möchtest du machen?",hint:"Tippe auf ein Bild – das Wort wird automatisch gesprochen.",back:"Zurück",sections:{communication:"Kommunikation",games:"Lernspiele",art:"Malen & Kreativität",daily:"Alltag lernen",feelings:"Gefühle",videos:"Lernvideos"},tap:"Tippe auf ein Bild. Das Wort wird gesprochen.",sentence:"Ich möchte",speak:"Satz sprechen",other:"Etwas anderes",items:{drink:"Trinken",eat:"Essen",play:"Spielen",toilet:"Toilette",mom:"Mama",dad:"Papa",help:"Hilfe",other:"Etwas anderes",water:"Wasser",juice:"Saft",milk:"Milch",strawberry:"Erdbeere",happy:"Fröhlich",sad:"Traurig",afraid:"Ängstlich",angry:"Wütend",calm:"Ruhig",tired:"Müde",hands:"Hände waschen",teeth:"Zähne putzen",dress:"Anziehen",sleep:"Schlafen"}},
en:{language:"Choose your language",welcome:"Hello! What would you like to do?",hint:"Tap a picture – the word will be spoken.",back:"Back",sections:{communication:"Communication",games:"Learning games",art:"Art & creativity",daily:"Everyday learning",feelings:"Feelings",videos:"Learning videos"},tap:"Tap a picture. The word will be spoken.",sentence:"I want",speak:"Speak sentence",other:"Something else",items:{drink:"Drinking",eat:"Eating",play:"Play",toilet:"Toilet",mom:"Mum",dad:"Dad",help:"Help",other:"Something else",water:"Water",juice:"Juice",milk:"Milk",strawberry:"Strawberry",happy:"Happy",sad:"Sad",afraid:"Afraid",angry:"Angry",calm:"Calm",tired:"Tired",hands:"Wash hands",teeth:"Brush teeth",dress:"Get dressed",sleep:"Sleep"}},
ru:{language:"Выберите язык",welcome:"Привет! Что хочешь делать?",hint:"Нажми на картинку — слово будет произнесено.",back:"Назад",sections:{communication:"Общение",games:"Обучающие игры",art:"Рисование и творчество",daily:"Повседневные навыки",feelings:"Чувства",videos:"Обучающие видео"},tap:"Нажми на картинку. Слово будет произнесено.",sentence:"Я хочу",speak:"Произнести фразу",other:"Что-то другое",items:{drink:"Пить",eat:"Есть",play:"Играть",toilet:"Туалет",mom:"Мама",dad:"Папа",help:"Помощь",other:"Что-то другое",water:"Вода",juice:"Сок",milk:"Молоко",strawberry:"Клубника",happy:"Радостный",sad:"Грустный",afraid:"Испуганный",angry:"Злой",calm:"Спокойный",tired:"Уставший",hands:"Мыть руки",teeth:"Чистить зубы",dress:"Одеваться",sleep:"Спать"}},
hy:{language:"Ընտրեք լեզուն",welcome:"Բարև։ Ի՞նչ ես ուզում անել։",hint:"Սեղմիր նկարի վրա․ բառը կհնչի։",back:"Հետ",sections:{communication:"Հաղորդակցություն",games:"Ուսուցողական խաղեր",art:"Նկարչություն և ստեղծագործություն",daily:"Առօրյա հմտություններ",feelings:"Զգացմունքներ",videos:"Ուսուցողական տեսանյութեր"},tap:"Սեղմիր նկարի վրա։ Բառը կհնչի։",sentence:"Ես ուզում եմ",speak:"Արտասանել նախադասությունը",other:"Այլ բան",items:{drink:"Խմել",eat:"Ուտել",play:"Խաղալ",toilet:"Զուգարան",mom:"Մայրիկ",dad:"Հայրիկ",help:"Օգնություն",other:"Այլ բան",water:"Ջուր",juice:"Հյութ",milk:"Կաթ",strawberry:"Ելակ",happy:"Ուրախ",sad:"Տխուր",afraid:"Վախեցած",angry:"Բարկացած",calm:"Հանգիստ",tired:"Հոգնած",hands:"Լվանալ ձեռքերը",teeth:"Մաքրել ատամները",dress:"Հագնվել",sleep:"Քնել"}}
};
const data={
communication:[["drink","🥤"],["eat","🍽️"],["play","🧸"],["toilet","🚽"],["mom","👩‍👧"],["dad","👨‍👧"],["help","🆘"],["other","❔"]],
drinks:[["water","💧"],["juice","🧃"],["milk","🥛"]],
foods:[["strawberry","🍓"]],
feelings:[["happy","😊"],["sad","😢"],["afraid","😟"],["angry","😠"],["calm","😌"],["tired","😴"]],
daily:[["hands","🧼"],["teeth","🪥"],["dress","👕"],["sleep","🌙"]]
};
let currentSection="communication",chosen=[];
const lang=document.getElementById("language");
function tr(){return translations[lang.value]}
function speak(text){if(!("speechSynthesis" in window)){alert("Die Sprachausgabe wird von diesem Browser leider nicht unterstützt.");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=({de:"de-DE",en:"en-US",ru:"ru-RU",hy:"hy-AM"})[lang.value];u.rate=.88;speechSynthesis.speak(u)}
function renderHome(){const t=tr();document.getElementById("languageLabel").textContent=t.language;document.getElementById("welcome").textContent=t.welcome;document.getElementById("homeHint").textContent=t.hint;document.getElementById("backText").textContent=t.back;document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t.sections[e.dataset.t]);}
function openSection(id){currentSection=id;chosen=[];document.getElementById("home").hidden=true;document.getElementById("detail").hidden=false;renderDetail()}
function renderDetail(){const t=tr();const title=t.sections[currentSection];document.getElementById("detailTitle").textContent=title;document.getElementById("detailHint").textContent=t.tap;document.getElementById("backText").textContent=t.back;const cards=document.getElementById("cards");cards.innerHTML="";let list=data[currentSection]||[];if(currentSection==="communication")list=[...data.communication];if(currentSection==="daily")list=data.daily;
list.forEach(([key,emoji])=>{const b=document.createElement("button");b.className="card";b.innerHTML=`<span class="emoji">${emoji}</span><span></span>`;b.lastChild.textContent=t.items[key]||key;b.onclick=()=>{if(currentSection==="communication"&&key==="drink"){renderSub("drinks","drink");return}if(currentSection==="communication"&&key==="eat"){renderSub("foods","eat");return}if(key==="other"){speak(t.items.other);return}chosen.push(t.items[key]||key);speak(t.items[key]||key);updateSentence()};cards.appendChild(b)});
document.getElementById("sentence").hidden=currentSection!=="communication"&&currentSection!=="daily";document.getElementById("speakLabel").textContent=t.speak;updateSentence()}
function renderSub(which,prefix){const t=tr(),cards=document.getElementById("cards");cards.innerHTML="";const back=document.createElement("button");back.className="back";back.textContent="← "+t.back;back.onclick=renderDetail;cards.appendChild(back);data[which].forEach(([key,emoji])=>{const b=document.createElement("button");b.className="card";b.innerHTML=`<span class="emoji">${emoji}</span><span></span>`;b.lastChild.textContent=t.items[key];b.onclick=()=>{const item=t.items[key];let phrase;if(lang.value==="de")phrase=prefix==="drink"?"Ich möchte "+item+" trinken":"Ich möchte "+item+" essen";else if(lang.value==="en")phrase=prefix==="drink"?"I want to drink "+item:"I want to eat "+item;else if(lang.value==="ru")phrase=prefix==="drink"?"Я хочу пить: "+item:"Я хочу есть: "+item;else phrase=prefix==="drink"?"Ես ուզում եմ խմել՝ "+item:"Ես ուզում եմ ուտել՝ "+item;chosen.push(phrase);speak(phrase);updateSentence()};cards.appendChild(b)})}
function updateSentence(){const t=tr();document.getElementById("sentenceText").textContent=chosen.join(" · ");document.getElementById("sentence").hidden=chosen.length===0}
document.querySelectorAll("[data-section]").forEach(b=>b.addEventListener("click",()=>openSection(b.dataset.section)));
document.getElementById("back").onclick=()=>{document.getElementById("detail").hidden=true;document.getElementById("home").hidden=false;chosen=[]};
document.getElementById("speakSentence").onclick=()=>speak(chosen.join(" "));
lang.onchange=()=>{renderHome();if(!document.getElementById("detail").hidden)renderDetail()};
renderHome();
if ("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));
</script>
</body></html>
