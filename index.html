
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff8f1">
<title>TEONAS HERZ</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --ink:#4b3932;
  --muted:#806d63;
  --paper:#fff8f1;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:Arial,sans-serif;
}
header {
  text-align:center;
  padding:22px 18px 12px;
}
.logo {
  display:block;
  width:min(68vw,250px);
  height:auto;
  margin:0 auto 12px;
  border-radius:24px;
}
h1 { font-size:30px; margin:8px 0 4px; }
.tagline { margin:0; color:var(--muted); font-size:17px; }
main { max-width:760px; margin:auto; padding:18px; }
.language {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:20px 0;
  font-weight:bold;
}
select {
  font:inherit;
  color:var(--ink);
  background:white;
  border:1px solid #e4d7ce;
  border-radius:14px;
  padding:12px;
}
h2 { font-size:25px; margin:10px 0 8px; }
.hint { color:var(--muted); line-height:1.5; margin-bottom:20px; }
.tiles {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.tile {
  border:0;
  border-radius:24px;
  min-height:150px;
  padding:18px 10px;
  color:var(--ink);
  font-size:19px;
  font-weight:bold;
  box-shadow:0 4px 12px #6d49300d;
}
.tile .emoji { display:block; font-size:48px; margin-bottom:12px; }
.communication { background:#ffe8d9; }
.games { background:#e5f2ff; }
.paint { background:#eee8ff; }
.everyday { background:#e7f4e8; }
.feelings { background:#ffe8f0; }
.videos { background:#fff0cf; }
.panel { margin-top:18px; }
.back {
  border:0;
  background:#f3e7df;
  color:var(--ink);
  border-radius:14px;
  padding:13px 18px;
  font-size:17px;
  margin-bottom:16px;
}
.cards {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.card {
  border:2px solid #f0e3da;
  background:white;
  border-radius:20px;
  min-height:125px;
  padding:16px 8px;
  color:var(--ink);
  font-size:18px;
  font-weight:bold;
}
.card .emoji { display:block; font-size:42px; margin-bottom:8px; }
button { cursor:pointer; }
button:active { transform:scale(.98); }
footer {
  text-align:center;
  color:var(--muted);
  padding:28px 12px;
  font-size:14px;
}
@media(max-width:360px) {
  .tile { min-height:125px; font-size:17px; }
}
</style>
</head>
<body>
<header>
  <img class="logo" src="logo.PNG" alt="Fuchs und Hase mit einem Herz">
  <h1>TEONAS HERZ</h1>
  <p class="tagline">Eine Herzenshilfe für jedes Kind.</p>
</header>

<main>
  <div class="language">
    <span id="languageLabel">Wähle deine Sprache</span>
    <select id="language" onchange="changeLanguage()">
      <option value="de">Deutsch</option>
      <option value="hy">Հայերեն</option>
      <option value="ru">Русский</option>
      <option value="en">English</option>
    </select>
  </div>

  <section id="home">
    <h2 id="welcome">Hallo! Was möchtest du machen?</h2>
    <p class="hint" id="hint">Tippe auf ein Bild – das Wort wird automatisch gesprochen.</p>
    <div class="tiles">
      <button class="tile communication" onclick="openSection('communication')">
        <span class="emoji">💬</span><span data-key="communication">Kommunikation</span>
      </button>
      <button class="tile games" onclick="openSection('games')">
        <span class="emoji">🧩</span><span data-key="games">Lernspiele</span>
      </button>
      <button class="tile paint" onclick="openSection('paint')">
        <span class="emoji">🎨</span><span data-key="paint">Malen & Kreativität</span>
      </button>
      <button class="tile everyday" onclick="openSection('everyday')">
        <span class="emoji">🪥</span><span data-key="everyday">Alltag lernen</span>
      </button>
      <button class="tile feelings" onclick="openSection('feelings')">
        <span class="emoji">❤️</span><span data-key="feelings">Gefühle</span>
      </button>
      <button class="tile videos" onclick="openSection('videos')">
        <span class="emoji">🎬</span><span data-key="videos">Lernen mit Videos</span>
      </button>
    </div>
  </section>

  <section id="detail" class="panel" hidden>
    <button class="back" onclick="goHome()" id="backButton">← Zurück</button>
    <h2 id="sectionTitle"></h2>
    <p class="hint" id="sectionHint"></p>
    <div class="cards" id="cards"></div>
  </section>
</main>

<footer>Mit Liebe für jedes Kind. ❤️</footer>

<script>
const translations = {
de:{
language:"Wähle deine Sprache",welcome:"Hallo! Was möchtest du machen?",
hint:"Tippe auf ein Bild – das Wort wird automatisch gesprochen.",
communication:"Kommunikation",games:"Lernspiele",paint:"Malen & Kreativität",
everyday:"Alltag lernen",feelings:"Gefühle",videos:"Lernen mit Videos",
back:"← Zurück",water:"Wasser",juice:"Saft",milk:"Milch",
drink:"Trinken",food:"Essen",play:"Spielen",toilet:"Toilette",
mama:"Mama",papa:"Papa",help:"Hilfe",other:"Etwas anderes",
strawberry:"Erdbeere",apple:"Apfel",banana:"Banane",
brush:"Zähne putzen",hands:"Hände waschen",dress:"Anziehen",kindergarten:"Zum Kindergarten gehen",
bath:"Baden",
shower:"Duschen",
playground:"Zum Spielplatz gehen",
happy:"Glücklich",sad:"Traurig",angry:"Wütend",afraid:"Ängstlich",
calm:"Ruhig",tired:"Müde",colors:"Farben",numbers:"Zahlen",
shapes:"Formen",animals:"Tiere",coming:"Dieser Bereich wird bald erweitert."
},
en:{
language:"Choose your language",welcome:"Hello! What would you like to do?",
hint:"Tap a picture – the word will be spoken automatically.",
communication:"Communication",games:"Learning games",paint:"Art & creativity",
everyday:"Everyday learning",feelings:"Feelings",videos:"Learning with videos",
back:"← Back",water:"Water",juice:"Juice",milk:"Milk",
drink:"Drinking",food:"Food",play:"Play",toilet:"Toilet",
mama:"Mummy",papa:"Daddy",help:"Help",other:"Something else",
strawberry:"Strawberry",apple:"Apple",banana:"Banana",
brush:"Brush teeth",hands:"Wash hands",dress:"Get dressed",kindergarten:"Go to kindergarten",
bath:"Have a bath",
shower:"Take a shower",
playground:"Go to the playground",
happy:"Happy",sad:"Sad",angry:"Angry",afraid:"Afraid",
calm:"Calm",tired:"Tired",colors:"Colors",numbers:"Numbers",
shapes:"Shapes",animals:"Animals",coming:"This section will be expanded soon."
},
ru:{
language:"Выберите язык",welcome:"Привет! Что ты хочешь делать?",
hint:"Нажми на картинку – слово будет произнесено.",
communication:"Общение",games:"Учебные игры",paint:"Рисование и творчество",
everyday:"Повседневная жизнь",feelings:"Чувства",videos:"Обучение с видео",
back:"← Назад",water:"Вода",juice:"Сок",milk:"Молоко",
drink:"Пить",food:"Еда",play:"Играть",toilet:"Туалет",
mama:"Мама",papa:"Папа",help:"Помощь",other:"Что-то другое",
strawberry:"Клубника",apple:"Яблоко",banana:"Банан",
brush:"Чистить зубы",hands:"Мыть руки",dress:"Одеваться",kindergarten:"Идти в детский сад",
bath:"Принимать ванну",
shower:"Принимать душ",
playground:"Идти на детскую площадку",
happy:"Радостный",sad:"Грустный",angry:"Злой",afraid:"Испуганный",
calm:"Спокойный",tired:"Уставший",colors:"Цвета",numbers:"Числа",
shapes:"Формы",animals:"Животные",coming:"Этот раздел скоро будет расширен."
},

language:"Ընտրիր լեզուն",welcome:"Բարև։ Ի՞նչ ես ուզում անել։",
hint:"Սեղմիր նկարի վրա՝ բառը կհնչի։",
communication:"Հաղորդակցություն",games:"Ուսուցողական խաղեր",
paint:"Նկարչություն և ստեղծագործություն",everyday:"Առօրյա կյանք",
feelings:"Զգացմունքներ",videos:"Սովորել տեսանյութերով",
back:"← Հետ",water:"Ջուր",juice:"Հյութ",milk:"Կաթ",
drink:"Խմել",food:"Ուտել",play:"Խաղալ",toilet:"Զուգարան",
mama:"Մայրիկ",papa:"Հայրիկ",help:"Օգնություն",other:"Այլ բան",
strawberry:"Ելակ",apple:"Խնձոր",banana:"Բանան",
brush:"Ատամները մաքրել",hands:"Լվանալ ձեռքերը",dress:"Հագնվել",kindergarten:"Գնալ մանկապարտեզ",
bath:"Լոգանք ընդունել",
shower:"Ցնցուղ ընդունել",
playground:"Գնալ խաղահրապարակ",
happy:"Ուրախ",sad:"Տխուր",angry:"Բարկացած",afraid:"Վախեցած",
calm:"Հանգիստ",tired:"Հոգնած",colors:"Գույներ",numbers:"Թվեր",
shapes:"Ձևեր",animals:"Կենդանիներ",coming:"Այս բաժինը շուտով կընդլայնվի։"
}
};

const sections = {
communication:{
title:"communication",
items:[
["🥤","drink"],["🍽️","food"],["🧸","play"],["🚽","toilet"],
["👩","mama"],["👨","papa"],["🆘","help"],["💗","other"]
]},
games:{title:"games",items:[
["🎨","colors"],["🔢","numbers"],["🔺","shapes"],["🐾","animals"]
]},
paint:{title:"paint",items:[["🖍️","paint"]]},
everyday:{title:"everyday",items:[
  ["🪥","brush"],
  ["🧼","hands"],
  ["👕","dress"],
  ["🏫","kindergarten"],
  ["🛁","bath"],
  ["🚿","shower"],
  ["🛝","playground"],
  ["😴","tired"],
  ["🎲","play"]
]},
feelings:{title:"feelings",items:[
["😊","happy"],["😢","sad"],["😠","angry"],
["😟","afraid"],["😌","calm"],["😴","tired"]
]},
videos:{title:"videos",items:[["🎬","coming"]]}
};

let currentLanguage="de";
let currentSection="";

function t(key){
 return translations[currentLanguage][key] || key;
}

function changeLanguage(){
 currentLanguage=document.getElementById("language").value;
 document.getElementById("languageLabel").textContent=t("language");
 document.getElementById("welcome").textContent=t("welcome");
 document.getElementById("hint").textContent=t("hint");
 document.getElementById("backButton").textContent=t("back");
 document.querySelectorAll("[data-key]").forEach(el=>{
   el.textContent=t(el.dataset.key);
 });
 if(currentSection) renderSection();
}

function speak(key){
 const word=t(key);
 if(!("speechSynthesis" in window)) return;
 window.speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(word);
 const voices=window.speechSynthesis.getVoices();
 const wanted={de:"de-DE",en:"en-US",ru:"ru-RU",hy:"hy-AM"}[currentLanguage];
 utterance.lang=wanted;
 const voice=voices.find(v=>v.lang.toLowerCase().startsWith(currentLanguage));
 if(voice) utterance.voice=voice;
 utterance.rate=0.85;
 window.speechSynthesis.speak(utterance);
}

function openSection(name){
 currentSection=name;
 document.getElementById("home").hidden=true;
 document.getElementById("detail").hidden=false;
 renderSection();
 window.scrollTo(0,0);
}

function renderSection(){
 const section=sections[currentSection];
 document.getElementById("sectionTitle").textContent=t(section.title);
 document.getElementById("sectionHint").textContent=
 currentSection==="communication" ? t("hint") : t("coming");
 const cards=document.getElementById("cards");
 cards.innerHTML="";
 section.items.forEach(([emoji,key])=>{
   const button=document.createElement("button");
   button.className="card";
   button.innerHTML='<span class="emoji">'+emoji+'</span>';
   const label=document.createElement("span");
   label.textContent=t(key);
   button.appendChild(label);
   button.addEventListener("click",()=>{
     if(currentSection==="communication" && key==="drink"){
       showChoices("drink",[
         ["💧","water"],["🧃","juice"],["🥛","milk"]
       ]);
     } else if(currentSection==="communication" && key==="food"){
       showChoices("food",[
         ["🍓","strawberry"],["🍎","apple"],["🍌","banana"]
       ]);
     } else {
       speak(key);
     }
   });
   cards.appendChild(button);
 });
}

function showChoices(type,items){
 const cards=document.getElementById("cards");
 document.getElementById("sectionTitle").textContent=t(type);
 document.getElementById("sectionHint").textContent=t("hint");
 cards.innerHTML="";
 items.forEach(([emoji,key])=>{
   const button=document.createElement("button");
   button.className="card";
   button.innerHTML='<span class="emoji">'+emoji+'</span>';
   const label=document.createElement("span");
   label.textContent=t(key);
   button.appendChild(label);
   button.addEventListener("click",()=>speak(key));
   cards.appendChild(button);
 });
}

function goHome(){
 currentSection="";
 document.getElementById("detail").hidden=true;
 document.getElementById("home").hidden=false;
 window.scrollTo(0,0);
}
</script>
</body>
</html>
